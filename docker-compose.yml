# ─────────────────────────────────────────────────────────────────────────────
#  Dining reservation bot — single-server deployment
#
#  Two containers: the bot, and the Redis it keeps everything in. Redis is not
#  published to the host, so the only way to reach it is from inside this compose
#  network — which is also why it needs no password here. If it ever has to be
#  reachable from elsewhere, set one and put it in REDIS_URL in `.env`.
#
#  Why the bot is still one container and not several: conversation state and
#  sessions are held in this process's memory, and the auto-reserve scheduler
#  runs inside the same process. With two replicas up, a user is lost mid-wizard
#  depending on which container their message reaches, and both replicas run
#  auto-reserve at the same time. Scaling horizontally means moving those two
#  caches to Redis as well — see docs/adr/0002.
#
#  Getting started:
#      cp .env.example .env      # and fill in the values
#      docker compose up -d --build
# ─────────────────────────────────────────────────────────────────────────────

name: dining-reservation-bot

services:
  redis:
    image: redis:8-alpine

    # Append-only persistence, flushed once a second.
    #
    # This is what makes the data survive a restart, and it is the reason the
    # volume below exists. Without it Redis is a cache: a crash or an image
    # upgrade silently discards every account, ticket and transcript. `everysec`
    # is the documented default and the right trade here — at most one second of
    # writes is lost, and no write pays for an fsync.
    #
    # The RDB snapshots are switched off so there is exactly one file to reason
    # about and one thing to restore.
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --appendfsync
      - everysec
      - --save
      - ''

    volumes:
      # The whole dataset. Losing this volume means every user has to sign in
      # again, and every support conversation is gone.
      - redis-data:/data

    # No `ports:` on purpose. Nothing outside this compose network can reach
    # Redis, so it cannot be read or wiped by anything on the host or the LAN.
    restart: unless-stopped

    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 64M

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  dining-reservation-bot:
    container_name: zeeabad5-8b25-4a7d-8ed1-f3f1516aaed6
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime

    image: dining-reservation-bot:1.0.0

    # Secrets and configuration come from .env and are never copied into the
    # image.
    env_file:
      - .env

    # These take precedence over the values in .env, because in a Docker
    # deployment the service names are what resolve, and the catalog directory
    # has to be on the volume rather than in the project's relative directory.
    environment:
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      DATA_DIR: /app/data
      TZ: ${TZ:-Asia/Tehran}

    volumes:
      # Only the operator-editable text catalog lives here. The data itself is in
      # Redis, which keeps its own volume above.
      - bot-data:/app/data

    # The bot is useless without Redis and would spend its start-up retrying, so
    # wait for the server to answer before starting it.
    depends_on:
      redis:
        condition: service_healthy

    ports:
      # The health server — and, in webhook mode, the delivery of Telegram
      # updates — are served on this one port, so the number has to match PORT
      # in .env.
      #
      # By default it is published on loopback only, because /health and /ready
      # have no authentication and expose the number of users and active
      # sessions to anyone who asks.
      #
      # If you have set TELEGRAM_WEBHOOK_URL, this port has to be reachable from
      # outside. Recommended: put it behind a TLS reverse proxy and forward only
      # the webhook path, then change this line to
      #     - '${PORT:-3000}:${PORT:-3000}'
      - '0.0.0.0:${PORT:-8086}:${PORT:-8086}'

    restart: unless-stopped

    # The process gets up to 8 seconds on SIGTERM; this number is slightly
    # higher so Docker reaches it before SIGKILL and the final WAL checkpoint
    # runs.
    stop_grace_period: 15s

    # The healthcheck is defined in the Dockerfile so it is maintained in one
    # place. Restarting automatically when the container turns unhealthy is not
    # wanted here: the restart policy above only reacts to process exit, and a
    # live but broken process is not improved by a blind restart.

    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 128M

    # The container is read-only by default; only the database volume and /tmp
    # are writable. If an attacker comes in through a dependency, they cannot
    # change the executable or the code on disk.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777

    # Stops the process from gaining extra privileges through setuid bits.
    security_opt:
      - no-new-privileges:true

    # Logs go to stdout as JSON; this setting keeps endless logs from filling
    # the server's disk.
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

volumes:
  bot-data:
    driver: local
  # Everything the bot knows. This is the volume that matters: back it up.
  redis-data:
    driver: local
