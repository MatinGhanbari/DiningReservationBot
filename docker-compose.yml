# ─────────────────────────────────────────────────────────────────────────────
#  ربات رزرو غذا — استقرار تک‌سروری
#
#  چرا یک کانتینر و نه بیشتر: وضعیت گفتگو و نشست‌ها در حافظهٔ همین فرایند
#  نگه داشته می‌شوند و زمان‌بند رزرو خودکار هم درون همین فرایند اجرا می‌شود.
#  اگر دو replica بالا بیاید، هر کاربر بسته به اینکه پیامش به کدام کانتینر
#  برسد وسط یک ویزارد گم می‌شود، و هر دو replica رزرو خودکار را هم‌زمان
#  اجرا می‌کنند. مقیاس‌پذیری افقی اینجا یعنی انتقال کش به یک سرویس مشترک.
#
#  راه‌اندازی:
#      cp .env.example .env      # و مقادیر را پر کنید
#      docker compose up -d --build
# ─────────────────────────────────────────────────────────────────────────────

name: dining-reservation-bot

services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime

    image: dining-reservation-bot:1.0.0

    # رازها و پیکربندی از .env خوانده می‌شوند و هرگز داخل ایمیج کپی نمی‌شوند.
    env_file:
      - .env

    # این‌ها روی مقادیر .env اولویت دارند، چون در استقرار داکری مسیر دیتابیس
    # باید روی والیوم باشد نه پوشهٔ نسبی پروژه.
    environment:
      NODE_ENV: production
      DATABASE_PATH: /app/data/bot.db
      TZ: ${TZ:-Asia/Tehran}

    volumes:
      # تنها داده‌ای که باید از کانتینر جان سالم به در ببرد: فایل SQLite و
      # کنارش WAL. با پاک‌شدن این والیوم، همهٔ کاربران باید دوباره وارد شوند.
      - bot-data:/app/data

    ports:
      # فقط روی loopback. این پورت فقط سلامت سرویس را گزارش می‌دهد و هیچ
      # احراز هویتی ندارد؛ بازکردنش روی 0.0.0.0 تعداد کاربران و نشست‌های
      # فعال را برای هر کسی قابل خواندن می‌کند.
      # اگر از بیرون به healthcheck نیاز دارید، پشت یک reverse proxy با
      # احراز هویت بگذارید یا این خط را به "3000:3000" تغییر دهید.
      - '127.0.0.1:3000:3000'

    restart: unless-stopped

    # فرایند در SIGTERM تا ۸ ثانیه فرصت دارد؛ این عدد کمی بیشتر است تا داکر
    # پیش از SIGKILL به آن برسد و checkpoint نهایی WAL اجرا شود.
    stop_grace_period: 15s

    # healthcheck در Dockerfile تعریف شده است تا فقط یک‌جا نگهداری شود.
    # شروع مجدد خودکار وقتی کانتینر unhealthy شود، اینجا لازم نیست:
    # restart سیاست بالا فقط روی خروج فرایند اثر دارد و یک فرایند زندهٔ
    # خرابکاری‌شده با ری‌استارت کورکورانه بهتر نمی‌شود.

    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 128M

    # کانتینر به‌صورت پیش‌فرض قابل نوشتن نیست؛ تنها والیوم دیتابیس و /tmp
    # قابل نوشتن‌اند. اگر مهاجم از طریق یک وابستگی وارد شود، نمی‌تواند
    # فایل اجرایی یا کد را روی دیسک تغییر دهد.
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777

    # اجازه نمی‌دهد فرایند از طریق setuid بیت‌های دسترسی بیشتری بگیرد.
    security_opt:
      - no-new-privileges:true

    # لاگ‌ها به‌صورت JSON به stdout می‌روند؛ این تنظیم جلوی پر شدن دیسک سرور
    # با لاگ‌های بی‌پایان را می‌گیرد.
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

volumes:
  bot-data:
    driver: local
